[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"

rocket = { version = "=0.6.0-rc.1", features = ["secrets", "tls", "json"] }
ws = { package = "rocket_ws", version = "=0.3.0-rc.1" }

diesel = { version = "2.4.0", features = ["postgres"] }
# build libpq and openssl as part of the build process
# uncomment these lines if you run into setup issues
# pq-sys = { version = "0.6", features = ["bundled"] }
# openssl-sys = { version = "0.9.100", features = ["vendored"] }
dotenvy = "0.15"
